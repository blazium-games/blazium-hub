name: Build Sign and Publish Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      force_engine_rebuild:
        description: Skip engine binary cache and rebuild all matrix cells
        type: boolean
        default: false

concurrency:
  group: hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Oldest still-supported GitHub-hosted images (not *-latest).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HUB_AUTOWORK: "1"

jobs:
  autowork:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Blazium editor (release, with Autowork + Luau)
        id: editor
        run: |
          set -euo pipefail
          LATEST="$(curl -fsSL https://cdn.blazium.app/catalog/versions/release/latest.json)"
          VER="$(printf '%s' "$LATEST" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          EDITORS_URL="https://cdn.blazium.app/release/${VER}/editors.json"
          ZIP_URL="$(curl -fsSL "$EDITORS_URL" | python3 -c '
          import json,sys
          for e in json.load(sys.stdin):
              name=e.get("filename","")
              if name.endswith("linux.x86_64.zip") and ".mono." not in name:
                  print(e["download_url"]); break
          else:
              raise SystemExit("linux editor zip not found")
          ')"
          mkdir -p .ci/editor
          curl -fsSL "$ZIP_URL" -o .ci/editor/blazium.zip
          python3 - <<'PY'
          import zipfile
          zipfile.ZipFile(".ci/editor/blazium.zip").extractall(".ci/editor/out")
          PY
          BIN="$(find .ci/editor/out -type f -name 'blazium*' -perm -111 | head -n1 || true)"
          if [ -z "$BIN" ]; then
            BIN="$(find .ci/editor/out -type f \( -name 'Blazium*' -o -name 'blazium*' \) | head -n1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          PREFERRED="$(find .ci/editor/out -type f -name 'blazium*x86_64' ! -name '*.console' | head -n1 || true)"
          if [ -n "$PREFERRED" ]; then
            BIN="$PREFERRED"
            chmod +x "$BIN"
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "Using $BIN (Blazium $VER)"
          "$BIN" --version || true

      - name: Run Autowork (GDScript + Luau)
        run: |
          set -euo pipefail
          "${{ steps.editor.outputs.bin }}" --headless --path "$GITHUB_WORKSPACE" -s run_tests.gd

  resolve-engine:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [autowork]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.hubver.outputs.version }}
      blazium_ref: ${{ steps.ref.outputs.ref }}
      enc_key_hash: ${{ steps.enc.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: Hub version
        id: hubver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Read BLAZIUM_REF
        id: ref
        run: |
          REF="$(tr -d '[:space:]' < ci/BLAZIUM_REF)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Engine pin: $REF"

      - name: Encryption key fingerprint
        id: enc
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          rm -f production.env
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in PRODUCTION_ENV" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          HASH="$(printf '%s' "$SCRIPT_ENCRYPTION_KEY" | sha256sum | awk '{print substr($1,1,16)}')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "ENC_KEY_HASH fingerprint ready (not the key)"

  build-engine:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linuxbsd
            arch: x86_64
            target: editor
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: editor
          - runner: ubuntu-22.04
            platform: linuxbsd
            arch: x86_64
            target: template_release
          - runner: ubuntu-22.04
            platform: linuxbsd
            arch: x86_32
            target: template_release
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: template_release
          - runner: windows-2022
            platform: windows
            arch: x86_32
            target: template_release
    steps:
      - uses: actions/checkout@v4

      - name: Cache key suffix
        id: cachekey
        run: |
          set -euo pipefail
          ENC="${{ needs.resolve-engine.outputs.enc_key_hash }}"
          if [[ "${{ matrix.target }}" != "template_release" ]]; then
            ENC="nokey"
          fi
          FORCE=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_engine_rebuild }}" == "true" ]]; then
            FORCE="-force-${{ github.run_id }}"
          fi
          KEY="hub-engine-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ needs.resolve-engine.outputs.blazium_ref }}-${{ hashFiles('ci/hub_scons.env') }}-${ENC}${FORCE}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Binary cache key: $KEY"

      - name: Restore binary cache
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: .ci/out
          key: ${{ steps.cachekey.outputs.key }}

      - name: Checkout blazium engine
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ needs.resolve-engine.outputs.blazium_ref }}
          path: .ci/engine
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space (Linux)
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install Linux build dependencies
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev yasm ccache patchelf
          if [[ "${{ matrix.arch }}" == "x86_32" ]]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib \
              libx11-dev:i386 libxcursor-dev:i386 libxinerama-dev:i386 \
              libxi-dev:i386 libxrandr-dev:i386 libgl1-mesa-dev:i386 \
              libasound2-dev:i386 libpulse-dev:i386 libudev-dev:i386
          fi

      - uses: actions/setup-python@v5
        if: steps.bin-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Install SCons
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: pip install scons==4.7.0

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'x86_32' && 'x86' || 'x64' }}

      - name: Load Hub SCons flags
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          set -a
          # shellcheck disable=SC1091
          source ci/hub_scons.env
          set +a
          mkdir -p .ci/flags
          printf '%s' "$HUB_SCONS_COMMON" > .ci/flags/common.txt
          printf '%s' "$HUB_SCONS_TEMPLATE" > .ci/flags/template.txt
          echo "COMMON: $(cat .ci/flags/common.txt)"
          echo "TEMPLATE EXTRA: $(cat .ci/flags/template.txt)"

      - name: Materialize encryption key for templates
        if: steps.bin-cache.outputs.cache-hit != 'true' && matrix.target == 'template_release'
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in production.env" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          umask 077
          mkdir -p .ci
          printf '%s' "$SCRIPT_ENCRYPTION_KEY" > .ci/script_aes256.key
          echo "Encryption key materialized for template_release (file only; not GITHUB_ENV)"

      - name: ccache
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ steps.cachekey.outputs.key }}-ccache
          max-size: 2G

      - name: Build engine binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        working-directory: .ci/engine
        run: |
          set -euo pipefail
          JOBS="$(nproc 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-8}")"
          EXTRA=""
          if [[ "${{ matrix.target }}" == "template_release" ]]; then
            export SCRIPT_AES256_ENCRYPTION_KEY
            SCRIPT_AES256_ENCRYPTION_KEY="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ci/script_aes256.key")"
            test -n "$SCRIPT_AES256_ENCRYPTION_KEY"
            EXTRA="$(cat ../flags/template.txt)"
          else
            unset SCRIPT_AES256_ENCRYPTION_KEY || true
          fi
          # shellcheck disable=SC2046,SC2086
          scons -j"$JOBS" platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} \
            $(cat ../flags/common.txt) $EXTRA \
            compiledb=no verbose=yes
          ls -lh bin/ || true

      - name: Stage binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci/out
          TARGET="${{ matrix.target }}"
          ARCH="${{ matrix.arch }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            BIN=$(find .ci/engine/bin -maxdepth 1 -type f -name "blazium.*.${TARGET}.${ARCH}.exe" ! -name '*.console.exe' | head -n1)
            OUT=".ci/out/${TARGET}.exe"
            MIN=10485760
            if [[ "$TARGET" == "template_release" ]]; then MIN=5242880; fi
          else
            BIN=$(find .ci/engine/bin -maxdepth 1 -type f -name "blazium.*.${TARGET}.${ARCH}" ! -name '*.console*' ! -name '*.o' | head -n1)
            OUT=".ci/out/${TARGET}"
            MIN=10485760
            if [[ "$TARGET" == "template_release" ]]; then MIN=5242880; fi
          fi
          test -n "${BIN:-}"
          test "$(stat -c%s "$BIN")" -ge "$MIN"
          cp "$BIN" "$OUT"
          chmod +x "$OUT" || true
          ls -lh .ci/out/
          echo "### ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify cached binary
        if: steps.bin-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            test -f ".ci/out/${{ matrix.target }}.exe"
            ls -lh ".ci/out/${{ matrix.target }}.exe"
          else
            test -f ".ci/out/${{ matrix.target }}"
            chmod +x ".ci/out/${{ matrix.target }}"
            ls -lh ".ci/out/${{ matrix.target }}"
          fi
          echo "Restored ${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.target }} from binary cache"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: .ci/out/
          retention-days: 3

      - name: Scrub encryption key material
        if: always()
        run: rm -f production.env .ci/script_aes256.key

  export-linux:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, build-engine]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    outputs:
      version: ${{ needs.resolve-engine.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: engine-linuxbsd-x86_64-editor
          path: .ci/out/linux-editor

      - uses: actions/download-artifact@v4
        with:
          name: engine-linuxbsd-${{ matrix.arch }}-template_release
          path: .ci/out/linux-template

      - name: Arrange editor + template paths
        run: |
          set -euo pipefail
          mkdir -p .ci/out/linux
          cp .ci/out/linux-editor/editor .ci/out/linux/editor
          cp .ci/out/linux-template/template_release .ci/out/linux/template_release
          chmod +x .ci/out/linux/editor .ci/out/linux/template_release
          ls -lh .ci/out/linux/
          test "$(stat -c%s .ci/out/linux/editor)" -ge 10485760
          test "$(stat -c%s .ci/out/linux/template_release)" -ge 5242880
          echo "Using x86_64 editor + ${{ matrix.arch }} template"

      - name: Materialize production.env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in production.env" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          umask 077
          mkdir -p .ci
          printf '%s' "$SCRIPT_ENCRYPTION_KEY" > .ci/export_encryption.key
          rm -f production.env
          echo "Export encryption key written to file (not GITHUB_ENV)"

      - name: Patch export_presets custom template
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")
          tpl = Path(".ci/out/linux/template_release").resolve().as_posix()
          out = []
          for line in text.splitlines():
              if line.startswith("custom_template/release="):
                  out.append(f'custom_template/release="{tpl}"')
              elif line.startswith("custom_template/debug="):
                  out.append(f'custom_template/debug="{tpl}"')
              else:
                  out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Export Linux Hub (${{ matrix.arch }})
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          if [[ "$ARCH" == "x86_32" ]]; then
            PRESET="Linux/X11 x86_32"
            OUT="build/linux/blazium-hub.x86_32"
          else
            PRESET="Linux/X11"
            OUT="build/linux/blazium-hub.x86_64"
          fi
          export SCRIPT_ENCRYPTION_KEY
          SCRIPT_ENCRYPTION_KEY="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ci/export_encryption.key")"
          export GODOT_SCRIPT_ENCRYPTION_KEY="$SCRIPT_ENCRYPTION_KEY"
          mkdir -p build/linux
          .ci/out/linux/editor --headless --path . --export-release "$PRESET" "$OUT"
          chmod +x "$OUT"
          echo "HUB_BIN=$OUT" >> "$GITHUB_ENV"
          echo "### Hub Linux ${ARCH}" >> "$GITHUB_STEP_SUMMARY"
          du -h "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch matching-arch blazium-cli + stage package tree
        run: |
          set -euo pipefail
          mkdir -p build/package/linux/bin
          python3 ci/fetch_latest_cli.py \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --out build/package/linux/bin/blazium-cli
          cp "$HUB_BIN" build/package/linux/bin/blazium-hub
          chmod +x build/package/linux/bin/blazium-hub build/package/linux/bin/blazium-cli
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/blazium-cli" "$@"' > build/package/linux/bin/blazium
          chmod +x build/package/linux/bin/blazium
          ls -lh build/package/linux/bin/

      - name: Install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz | tar -xz
          sudo mv nfpm /usr/local/bin/

      - name: Build .deb
        run: |
          set -euo pipefail
          export VERSION=${{ needs.resolve-engine.outputs.version }}
          if [[ "${{ matrix.arch }}" == "x86_32" ]]; then
            export NFPM_ARCH=i386
          else
            export NFPM_ARCH=amd64
          fi
          mkdir -p packaging/linux/dist
          (cd packaging/linux && VERSION="$VERSION" NFPM_ARCH="$NFPM_ARCH" nfpm package --packager deb --target dist/)
          DEB=$(ls packaging/linux/dist/blazium-hub_*_${NFPM_ARCH}.deb | head -n1)
          test -f "$DEB"
          echo "DEB_PATH=$DEB" >> "$GITHUB_ENV"
          BASE=$(basename "$DEB")
          echo "DEB_NAME=$BASE" >> "$GITHUB_ENV"
          ls -lh packaging/linux/dist/

      - name: Install/uninstall smoke (dpkg)
        run: |
          set -euo pipefail
          chmod +x ci/smoke_install_linux.sh ci/smoke_install_linux_debinfo.sh
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            ./ci/smoke_install_linux.sh "$DEB_PATH"
          else
            ./ci/smoke_install_linux_debinfo.sh "$DEB_PATH"
          fi

      - name: Import GPG and sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --output "${DEB_PATH}.sig" --detach-sign "$DEB_PATH"
          fi

      - name: Digest
        id: digest
        run: |
          SHA=$(sha256sum "$DEB_PATH" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEB_PATH")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          mkdir -p "upload/linux/${{ needs.resolve-engine.outputs.version }}"
          cp "$DEB_PATH" "upload/linux/${{ needs.resolve-engine.outputs.version }}/"
          if [ -f "${DEB_PATH}.sig" ]; then
            cp "${DEB_PATH}.sig" "upload/linux/${{ needs.resolve-engine.outputs.version }}/"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.arch }}
          path: upload/linux/**

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: upload/linux/${{ needs.resolve-engine.outputs.version }}/${{ env.DEB_NAME }}
          out_dir: hub/linux/${{ needs.resolve-engine.outputs.version }}

      - name: Register with Cerebro
        env:
          URL: https://cdn.blazium.app/hub/linux/${{ needs.resolve-engine.outputs.version }}/${{ env.DEB_NAME }}
        run: |
          SIG_URL="${URL}.sig"
          curl -s -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
            -d "$(cat <<EOF
          {
            "name": "Blazium Hub",
            "type": "hub",
            "version": "${{ needs.resolve-engine.outputs.version }}",
            "os": "linux",
            "arch": "${{ matrix.arch }}",
            "file": "$URL",
            "sig": "$SIG_URL",
            "sha256": "${{ steps.digest.outputs.sha256 }}",
            "size": ${{ steps.digest.outputs.size }},
            "signing": "gpg",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"

      - name: Scrub encryption key material
        if: always()
        run: rm -f production.env .ci/export_encryption.key

  export-windows:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, build-engine]
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    outputs:
      version: ${{ needs.resolve-engine.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: engine-windows-x86_64-editor
          path: .ci/out/windows-editor

      - uses: actions/download-artifact@v4
        with:
          name: engine-windows-${{ matrix.arch }}-template_release
          path: .ci/out/windows-template

      - name: Arrange editor + template paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/out/windows
          cp .ci/out/windows-editor/editor.exe .ci/out/windows/editor.exe
          cp .ci/out/windows-template/template_release.exe .ci/out/windows/template_release.exe
          ls -lh .ci/out/windows/
          test "$(stat -c%s .ci/out/windows/editor.exe)" -ge 10485760
          test "$(stat -c%s .ci/out/windows/template_release.exe)" -ge 5242880
          echo "Using x86_64 editor + ${{ matrix.arch }} template"

      - name: Materialize production.env
        shell: bash
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in production.env" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          umask 077
          mkdir -p .ci
          printf '%s' "$SCRIPT_ENCRYPTION_KEY" > .ci/export_encryption.key
          rm -f production.env
          echo "Export encryption key written to file (not GITHUB_ENV)"

      - name: Patch export_presets custom template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")
          tpl = Path(".ci/out/windows/template_release.exe").resolve().as_posix()
          out = []
          for line in text.splitlines():
              if line.startswith("custom_template/release="):
                  out.append(f'custom_template/release="{tpl}"')
              elif line.startswith("custom_template/debug="):
                  out.append(f'custom_template/debug="{tpl}"')
              else:
                  out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Export Windows Hub (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          if [[ "$ARCH" == "x86_32" ]]; then
            PRESET="Windows Desktop x86_32"
            OUT="build/windows/BlaziumHub.x86_32.exe"
          else
            PRESET="Windows Desktop"
            OUT="build/windows/BlaziumHub.x86_64.exe"
          fi
          export SCRIPT_ENCRYPTION_KEY
          SCRIPT_ENCRYPTION_KEY="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ci/export_encryption.key")"
          export GODOT_SCRIPT_ENCRYPTION_KEY="$SCRIPT_ENCRYPTION_KEY"
          mkdir -p build/windows
          .ci/out/windows/editor.exe --headless --path . --export-release "$PRESET" "$OUT"
          test -f "$OUT"
          # Inno expects Hub/BlaziumHub.exe
          cp "$OUT" build/windows/BlaziumHub.exe
          echo "HUB_BIN=$OUT" >> "$GITHUB_ENV"
          echo "### Hub Windows ${ARCH}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch matching-arch blazium-cli + stage package tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/windows/Hub
          cp build/windows/BlaziumHub.exe build/package/windows/Hub/BlaziumHub.exe
          python3 ci/fetch_latest_cli.py \
            --platform windows \
            --arch "${{ matrix.arch }}" \
            --out build/package/windows/blazium-cli.exe
          cp packaging/windows/blazium.cmd build/package/windows/blazium.cmd
          cp packaging/windows/blazium-hub.cmd build/package/windows/blazium-hub.cmd
          ls -lh build/package/windows/ build/package/windows/Hub/

      - uses: bioblaze/sslcom-code-signer@v5
        name: Sign BlaziumHub.exe
        continue-on-error: true
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/package/windows/Hub/BlaziumHub.exe
          output_path: ./build/package/windows/Hub
          environment_name: PROD

      - uses: bioblaze/sslcom-code-signer@v5
        name: Sign blazium-cli.exe
        continue-on-error: true
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/package/windows/blazium-cli.exe
          output_path: ./build/package/windows
          environment_name: PROD

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer (iscc)
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.resolve-engine.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          EXTRA=()
          if [[ "$ARCH" == "x86_32" ]]; then
            EXTRA+=("/DMyAppIs32=1")
          fi
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DMyAppVersion=${VER}" \
            "/DMyAppArchLabel=${ARCH}" \
            "/DMyAppSourceDir=$(pwd)/build/package/windows" \
            "${EXTRA[@]}" \
            packaging/windows/blazium-hub.iss
          SETUP="packaging/windows/Output/BlaziumHub-Setup-${VER}-${ARCH}.exe"
          test -f "$SETUP"
          echo "SETUP_PATH=$SETUP" >> "$GITHUB_ENV"
          echo "SETUP_NAME=$(basename "$SETUP")" >> "$GITHUB_ENV"
          ls -lh packaging/windows/Output/

      - name: Digest installer
        id: digest
        shell: bash
        run: |
          SHA=$(sha256sum "$SETUP_PATH" | awk '{print $1}')
          SIZE=$(wc -c < "$SETUP_PATH" | tr -d ' ')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - uses: bioblaze/sslcom-code-signer@v5
        name: Sign installer
        continue-on-error: true
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.SETUP_PATH }}
          output_path: ./packaging/windows/Output
          environment_name: PROD

      - name: Install/uninstall smoke (custom DIR)
        shell: powershell
        run: |
          ./ci/smoke_install_windows.ps1 -SetupPath "$env:SETUP_PATH"

      - name: Stage upload
        shell: bash
        run: |
          VER="${{ needs.resolve-engine.outputs.version }}"
          mkdir -p "upload/windows/${VER}"
          cp "$SETUP_PATH" "upload/windows/${VER}/"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.arch }}
          path: upload/windows/**

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: upload/windows/${{ needs.resolve-engine.outputs.version }}/${{ env.SETUP_NAME }}
          out_dir: hub/windows/${{ needs.resolve-engine.outputs.version }}

      - name: Register with Cerebro
        shell: bash
        env:
          URL: https://cdn.blazium.app/hub/windows/${{ needs.resolve-engine.outputs.version }}/${{ env.SETUP_NAME }}
        run: |
          curl -s -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
            -d "$(cat <<EOF
          {
            "name": "Blazium Hub",
            "type": "hub",
            "version": "${{ needs.resolve-engine.outputs.version }}",
            "os": "windows",
            "arch": "${{ matrix.arch }}",
            "file": "$URL",
            "sig": "",
            "sha256": "${{ steps.digest.outputs.sha256 }}",
            "size": ${{ steps.digest.outputs.size }},
            "signing": "sslcom",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"

      - name: Scrub encryption key material
        if: always()
        shell: bash
        run: rm -f production.env .ci/export_encryption.key

  publish-catalog:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, export-windows, export-linux]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ needs.resolve-engine.outputs.version }}
    steps:
      - name: Republish Hub catalog via Cerebro
        run: |
          set -euo pipefail
          curl -fsS -X POST "${{ secrets.CEREBRO_URL }}/api/v1/cdn/publish" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
            -d '{"scope":"hub"}'

  github-release:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, publish-catalog, export-linux, export-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${{ needs.publish-catalog.outputs.version }}"
          fi
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Download all Hub installers
        uses: actions/download-artifact@v4
        with:
          pattern: '{linux-deb-*,windows-installer-*}'
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.sig' \) | sort)
          test "${#FILES[@]}" -ge 4
          NOTES="Blazium Hub ${VER}

          Installers (Linux/Windows × x86_64/x86_32), each bundling matching-arch blazium-cli.

          | Platform | Arch | Artifact |
          |----------|------|----------|
          | Linux | x86_64 | \`*.amd64.deb\` |
          | Linux | x86_32 | \`*.i386.deb\` |
          | Windows | x86_64 | \`BlaziumHub-Setup-${VER}-x86_64.exe\` |
          | Windows | x86_32 | \`BlaziumHub-Setup-${VER}-x86_32.exe\` |

          CDN:
          - https://cdn.blazium.app/hub/windows/${VER}/
          - https://cdn.blazium.app/hub/linux/${VER}/

          Silent Windows (any directory):
          \`\`\`
          BlaziumHub-Setup-${VER}-x86_64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=\"D:\\\\Tools\\\\Blazium\"
          \`\`\`
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Blazium Hub ${VER}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release view "$TAG"

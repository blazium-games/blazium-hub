name: Build Sign and Publish Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      force_engine_rebuild:
        description: Skip engine binary cache and rebuild all matrix cells
        type: boolean
        default: false

concurrency:
  group: hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Oldest still-supported GitHub-hosted images (not *-latest).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autowork:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HUB_AUTOWORK: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Test nightly resolver
        working-directory: ci
        run: python3 -m unittest discover -v

      - name: Download Blazium editor (nightly on blazium_4.8, with Autowork + Luau)
        id: editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENGINE_OUT="$(python3 ci/resolve_nightly_engine.py --fallback ci/BLAZIUM_REF)"
          echo "$ENGINE_OUT"
          SHA="$(printf '%s\n' "$ENGINE_OUT" | sed -n 's/^ref=//p')"
          test -n "$SHA"
          STATUS="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/blazium-games/blazium/compare/${SHA}...blazium_4.8" \
            | jq -r '.status // empty')"
          case "$STATUS" in
            ahead|identical)
              echo "nightly engine ${SHA} is contained in blazium_4.8"
              ;;
            *)
              echo "nightly engine ${SHA} is not an ancestor of blazium_4.8 (status=${STATUS:-missing}); using the published nightly editor for Autowork only. Engine builds stay on blazium_4.8."
              ;;
          esac
          RESOLVED="$(python3 ci/resolve_nightly_editor.py --github-output "$GITHUB_OUTPUT")"
          echo "$RESOLVED"
          VER="$(printf '%s\n' "$RESOLVED" | sed -n 's/^version=//p')"
          ZIP_URL="$(printf '%s\n' "$RESOLVED" | sed -n 's/^zip_url=//p')"
          test -n "$VER"
          test -n "$ZIP_URL"
          mkdir -p .ci/editor
          curl -fsSL "$ZIP_URL" -o .ci/editor/blazium.zip
          python3 - <<'PY'
          import zipfile
          zipfile.ZipFile(".ci/editor/blazium.zip").extractall(".ci/editor/out")
          PY
          BIN="$(find .ci/editor/out -type f -name 'blazium*' -perm -111 | head -n1 || true)"
          if [ -z "$BIN" ]; then
            BIN="$(find .ci/editor/out -type f \( -name 'Blazium*' -o -name 'blazium*' \) | head -n1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          PREFERRED="$(find .ci/editor/out -type f -name 'blazium*x86_64' ! -name '*.console' | head -n1 || true)"
          if [ -n "$PREFERRED" ]; then
            BIN="$PREFERRED"
            chmod +x "$BIN"
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "Using $BIN (Blazium $VER)"
          "$BIN" --version || true

      - name: Run Autowork (GDScript + Luau)
        run: |
          set -euo pipefail
          "${{ steps.editor.outputs.bin }}" --headless --path "$GITHUB_WORKSPACE" -s run_tests.gd

  resolve-engine:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [autowork]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.hubver.outputs.version }}
      blazium_ref: ${{ steps.ref.outputs.ref }}
      blazium_sha: ${{ steps.ref.outputs.sha }}
      enc_key_hash: ${{ steps.enc.outputs.hash }}
    steps:
      - uses: actions/checkout@v5

      - name: Get Version with Bioblaze/game-semver-action
        uses: Bioblaze/game-semver-action@v10
        id: semver
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hub version
        id: hubver
        env:
          SEMVER_SIMPLE: ${{ steps.semver.outputs.simple_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            # game-semver: patch-per-commit from 0.0.0, then max() with tags.
            # An existing v0.1.0 tag therefore freezes simple_version at 0.1.0 forever
            # (0.0.N never exceeds 0.1.0). Advance past the latest v* tag when needed.
            V="$(python3 - <<'PY'
          import json, os, re, subprocess, urllib.request

          def parse(v: str):
              parts = [p for p in re.split(r"[^\d]+", v.strip()) if p != ""]
              nums = [int(p) if p.isdigit() else 0 for p in parts[:3]]
              while len(nums) < 3:
                  nums.append(0)
              return tuple(nums)

          def fmt(t):
              return f"{t[0]}.{t[1]}.{t[2]}"

          def bump_patch(t):
              return (t[0], t[1], t[2] + 1)

          semver = os.environ.get("SEMVER_SIMPLE", "").strip()
          if not semver:
              raise SystemExit("empty SEMVER_SIMPLE")
          cand = parse(semver)

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/tags?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              tags = json.load(resp)
          highest = None
          for tag in tags:
              name = tag.get("name") or ""
              m = re.match(r"^v?(\d+\.\d+\.\d+)$", name.strip())
              if not m:
                  continue
              t = parse(m.group(1))
              if highest is None or t > highest:
                  highest = t

          if highest is not None and cand <= highest:
              out = fmt(bump_patch(highest))
              print(f"semver simple_version={semver} <= latest tag {fmt(highest)}; using {out}", flush=True)
          else:
              out = fmt(cand)
              print(f"using game-semver simple_version={out}", flush=True)
          print(out)
          PY
          )"
            # Last line is the version; strip log lines if any leaked (take last token line).
            V="$(printf '%s\n' "$V" | tail -n1 | tr -d '[:space:]')"
          fi
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Hub version: $V"
          # Workspace only; local-dev VERSION in git stays as a default.
          printf '%s\n' "$V" > VERSION

      - name: Resolve blazium_4.8
        id: ref
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/blazium-games/blazium.git refs/heads/blazium_4.8 | awk '{print $1}')"
          test -n "$SHA"
          echo "ref=blazium_4.8" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "blazium_4.8 ${SHA}"

      - name: Encryption key fingerprint
        id: enc
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          rm -f production.env
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in PRODUCTION_ENV" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          HASH="$(printf '%s' "$SCRIPT_ENCRYPTION_KEY" | sha256sum | awk '{print substr($1,1,16)}')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "ENC_KEY_HASH fingerprint ready (not the key)"

  build-engine:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linuxbsd
            arch: x86_64
            target: editor
            msvc_arch: ""
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: editor
            msvc_arch: x64
          - runner: ubuntu-22.04
            platform: linuxbsd
            arch: x86_64
            target: template_release
            msvc_arch: ""
          - runner: ubuntu-22.04
            platform: linuxbsd
            arch: x86_32
            target: template_release
            msvc_arch: ""
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: template_release
            msvc_arch: x64
          - runner: windows-2022
            platform: windows
            arch: x86_32
            target: template_release
            msvc_arch: x86
    steps:
      - uses: actions/checkout@v5

      - name: Cache key suffix
        id: cachekey
        run: |
          set -euo pipefail
          ENC="${{ needs.resolve-engine.outputs.enc_key_hash }}"
          if [[ "${{ matrix.target }}" != "template_release" ]]; then
            ENC="nokey"
          fi
          FORCE=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_engine_rebuild }}" == "true" ]]; then
            FORCE="-force-${{ github.run_id }}"
          fi
          # -clang32-m32: Windows x86_32 template is clang-cl -m32 (use_llvm=yes, lto=none).
          # Host clang-cl emits x64 objects unless -m32 is passed.
          KEY="hub-engine-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-blazium_4.8-${{ needs.resolve-engine.outputs.blazium_sha }}-${{ needs.resolve-engine.outputs.version }}-${{ hashFiles('ci/hub_scons.env') }}-${ENC}-clang32-m32${FORCE}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Binary cache key: $KEY"

      - name: Restore binary cache
        id: bin-cache
        uses: actions/cache@v5
        with:
          path: .ci/out
          key: ${{ steps.cachekey.outputs.key }}

      - name: Checkout blazium engine
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: blazium-games/blazium
          ref: blazium_4.8
          path: .ci/engine
          submodules: recursive
          fetch-depth: 1

      # Blazium setup_msvc_manual never sets TARGET_ARCH (unlike setup_msvc_auto), so under
      # ilammy/msvc-dev-cmd the linker emits x64 PE for arch=x86_32. Mirror auto's mapping.
      - name: Patch MSVC VCVARS TARGET_ARCH
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p = Path(".ci/engine/platform/windows/detect.py")
          text = p.read_text(encoding="utf-8")
          marker = "# Hub CI: set TARGET_ARCH for VCVARS/msvc-dev-cmd"
          if marker in text:
              print("detect.py already patched")
              raise SystemExit(0)
          needle = (
              '    print("Using VCVARS-determined MSVC, arch %s" % (env_arch))\n\n'
              "    # Replace any early-loaded mingw/default tools with MSVC (same as setup_msvc_auto).\n"
          )
          insert = (
              '    print("Using VCVARS-determined MSVC, arch %s" % (env_arch))\n\n'
              f"    {marker}\n"
              '    msvc_arch_aliases = {"x86_32": "x86", "arm32": "arm"}\n'
              '    if env["arch"] in msvc_arch_aliases:\n'
              '        env["TARGET_ARCH"] = msvc_arch_aliases[env["arch"]]\n'
              "    else:\n"
              '        env["TARGET_ARCH"] = env["arch"]\n\n'
              "    # Replace any early-loaded mingw/default tools with MSVC (same as setup_msvc_auto).\n"
          )
          if needle not in text:
              if 'env["TARGET_ARCH"]' in text and "def setup_msvc_manual" not in text:
                  print("detect.py already sets TARGET_ARCH; skipping VCVARS patch")
                  raise SystemExit(0)
              raise SystemExit("detect.py patch anchor not found; update Hub CI patch")
          p.write_text(text.replace(needle, insert, 1), encoding="utf-8")
          print("Patched setup_msvc_manual to set TARGET_ARCH")
          PY

      - name: Free disk space (Linux)
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install Linux build dependencies
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev yasm ccache patchelf
          if [[ "${{ matrix.arch }}" == "x86_32" ]]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib \
              libx11-dev:i386 libxcursor-dev:i386 libxinerama-dev:i386 \
              libxi-dev:i386 libxrandr-dev:i386 libgl1-mesa-dev:i386 \
              libasound2-dev:i386 libpulse-dev:i386 libudev-dev:i386
          fi

      - uses: actions/setup-python@v5
        # Always on Windows (PE arch assert on cache hit); otherwise only when building.
        if: runner.os == 'Windows' || steps.bin-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Install SCons
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: pip install scons==4.10.1

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.bin-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Load Hub SCons flags
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          set -a
          # shellcheck disable=SC1091
          source ci/hub_scons.env
          set +a
          mkdir -p .ci/flags
          printf '%s' "$HUB_SCONS_COMMON" > .ci/flags/common.txt
          printf '%s' "$HUB_SCONS_EDITOR editor_build_id=${{ needs.resolve-engine.outputs.blazium_sha }}" > .ci/flags/editor.txt
          printf '%s' "$HUB_SCONS_TEMPLATE template_build_id=${{ needs.resolve-engine.outputs.version }}" > .ci/flags/template.txt
          echo "COMMON: $(cat .ci/flags/common.txt)"
          echo "EDITOR EXTRA: $(cat .ci/flags/editor.txt)"
          echo "TEMPLATE EXTRA: $(cat .ci/flags/template.txt)"

      - name: Materialize encryption key for templates
        if: steps.bin-cache.outputs.cache-hit != 'true' && matrix.target == 'template_release'
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in production.env" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          umask 077
          mkdir -p .ci
          printf '%s' "$SCRIPT_ENCRYPTION_KEY" > .ci/script_aes256.key
          echo "Encryption key materialized for template_release (file only; not GITHUB_ENV)"

      - name: ccache
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ steps.cachekey.outputs.key }}-ccache
          max-size: 2G

      - name: Build engine binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        working-directory: .ci/engine
        run: |
          set -euo pipefail
          JOBS="$(nproc 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-8}")"
          EXTRA=""
          if [[ "${{ matrix.target }}" == "template_release" ]]; then
            export SCRIPT_AES256_ENCRYPTION_KEY
            SCRIPT_AES256_ENCRYPTION_KEY="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ci/script_aes256.key")"
            test -n "$SCRIPT_AES256_ENCRYPTION_KEY"
            EXTRA="$(cat ../flags/template.txt)"
          else
            unset SCRIPT_AES256_ENCRYPTION_KEY || true
            EXTRA="$(cat ../flags/editor.txt)"
          fi
          # Blazium setup_msvc_manual (VCVARS path) never sets SCons TARGET_ARCH, so the
          # linker defaults to x64 PE even when the compiler is x86. Force /MACHINE:X86.
          # MSVC x86 (with or without /LTCG) segfaults that template after PhysicsServer2D
          # init. clang-cl keeps 16-byte stack alignment, but the host clang-cl emits x64
          # objects unless -m32 is set. Godot links clang_rt.builtins-x86_32.lib; LLVM ships
          # that runtime as clang_rt.builtins-i386.lib.
          LINK_EXTRA=""
          if [[ "${{ matrix.platform }}" == "windows" && "${{ matrix.arch }}" == "x86_32" ]]; then
            if [[ "${{ matrix.target }}" == "template_release" ]]; then
              EXTRA="$EXTRA lto=none use_llvm=yes ccflags=-m32"
              RT="$(find "/c/Program Files/LLVM/lib/clang" "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/lib/clang" -name 'clang_rt.builtins-i386.lib' -print -quit 2>/dev/null || true)"
              test -n "$RT"
              mkdir -p "$GITHUB_WORKSPACE/.ci/rt"
              cp "$RT" "$GITHUB_WORKSPACE/.ci/rt/clang_rt.builtins-x86_32.lib"
              export LIB="$GITHUB_WORKSPACE/.ci/rt${LIB:+;$LIB}"
              echo "32-bit compiler-rt: $RT"
            fi
            LINK_EXTRA='linkflags=/MACHINE:X86'
            if [[ -n "${LIB:-}" ]]; then
              LIB="$(printf '%s' "$LIB" | tr ';' '\n' | grep -viE '[\\/](x64|arm64)(\\|/|$)' | paste -sd';' - || true)"
              export LIB
              echo "Filtered LIB for x86_32 (no x64/arm64): $LIB"
            fi
          fi
          # shellcheck disable=SC2046,SC2086
          scons -j"$JOBS" platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} \
            $(cat ../flags/common.txt) $EXTRA $LINK_EXTRA \
            compiledb=no verbose=yes
          ls -lh bin/ || true

      - name: Stage binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci/out
          TARGET="${{ matrix.target }}"
          ARCH="${{ matrix.arch }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            BIN=$(find .ci/engine/bin -maxdepth 1 -type f \( -name "blazium.*.${TARGET}.${ARCH}.exe" -o -name "blazium.*.${TARGET}.${ARCH}.llvm.exe" \) ! -name '*.console.exe' | head -n1)
            OUT=".ci/out/${TARGET}.exe"
            MIN=10485760
            if [[ "$TARGET" == "template_release" ]]; then MIN=5242880; fi
          else
            BIN=$(find .ci/engine/bin -maxdepth 1 -type f -name "blazium.*.${TARGET}.${ARCH}" ! -name '*.console*' ! -name '*.o' | head -n1)
            OUT=".ci/out/${TARGET}"
            MIN=10485760
            if [[ "$TARGET" == "template_release" ]]; then MIN=5242880; fi
          fi
          test -n "${BIN:-}"
          test "$(stat -c%s "$BIN")" -ge "$MIN"
          cp "$BIN" "$OUT"
          chmod +x "$OUT" || true
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            python ci/assert_pe_arch.py "$OUT" "$ARCH"
          fi
          ls -lh .ci/out/
          echo "### ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify cached binary
        if: steps.bin-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            test -f ".ci/out/${{ matrix.target }}.exe"
            ls -lh ".ci/out/${{ matrix.target }}.exe"
            python ci/assert_pe_arch.py ".ci/out/${{ matrix.target }}.exe" "${{ matrix.arch }}"
          else
            test -f ".ci/out/${{ matrix.target }}"
            chmod +x ".ci/out/${{ matrix.target }}"
            ls -lh ".ci/out/${{ matrix.target }}"
          fi
          echo "Restored ${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.target }} from binary cache"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: .ci/out/
          retention-days: 3

      - name: Scrub encryption key material
        if: always()
        run: rm -f production.env .ci/script_aes256.key

  export-linux:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, build-engine]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    outputs:
      version: ${{ needs.resolve-engine.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: engine-linuxbsd-x86_64-editor
          path: .ci/out/linux-editor

      - uses: actions/download-artifact@v8
        with:
          name: engine-linuxbsd-${{ matrix.arch }}-template_release
          path: .ci/out/linux-template

      - name: Arrange editor + template paths
        run: |
          set -euo pipefail
          mkdir -p .ci/out/linux
          cp .ci/out/linux-editor/editor .ci/out/linux/editor
          cp .ci/out/linux-template/template_release .ci/out/linux/template_release
          chmod +x .ci/out/linux/editor .ci/out/linux/template_release
          ls -lh .ci/out/linux/
          test "$(stat -c%s .ci/out/linux/editor)" -ge 10485760
          test "$(stat -c%s .ci/out/linux/template_release)" -ge 5242880
          echo "Using x86_64 editor + ${{ matrix.arch }} template"

      - name: Materialize production.env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in production.env" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          umask 077
          mkdir -p .ci
          printf '%s' "$SCRIPT_ENCRYPTION_KEY" > .ci/export_encryption.key
          rm -f production.env
          echo "Export encryption key written to file (not GITHUB_ENV)"

      - name: Stamp Hub version into project
        run: |
          set -euo pipefail
          python3 ci/stamp_hub_version.py "${{ needs.resolve-engine.outputs.version }}"
          grep -E '^config/version=' project.godot
          grep -E '^crash_reporter/(build_id|app_version|endpoint|upload_mode)=' project.godot
          grep -E '^application/(file|product)_version=' export_presets.cfg | head -n4

      - name: Patch export_presets custom template
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")
          tpl = Path(".ci/out/linux/template_release").resolve().as_posix()
          out = []
          for line in text.splitlines():
              if line.startswith("custom_template/release="):
                  out.append(f'custom_template/release="{tpl}"')
              elif line.startswith("custom_template/debug="):
                  out.append(f'custom_template/debug="{tpl}"')
              else:
                  out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Export Linux Hub (${{ matrix.arch }})
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          if [[ "$ARCH" == "x86_32" ]]; then
            PRESET="Linux/X11 x86_32"
            OUT="build/linux/blazium-hub.x86_32"
          else
            PRESET="Linux/X11"
            OUT="build/linux/blazium-hub.x86_64"
          fi
          export SCRIPT_ENCRYPTION_KEY
          SCRIPT_ENCRYPTION_KEY="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ci/export_encryption.key")"
          export GODOT_SCRIPT_ENCRYPTION_KEY="$SCRIPT_ENCRYPTION_KEY"
          mkdir -p build/linux
          .ci/out/linux/editor --headless --path . --import
          .ci/out/linux/editor --headless --path . --export-release "$PRESET" "$OUT"
          chmod +x "$OUT"
          echo "HUB_BIN=$OUT" >> "$GITHUB_ENV"
          echo "### Hub Linux ${ARCH}" >> "$GITHUB_STEP_SUMMARY"
          du -h "$OUT" >> "$GITHUB_STEP_SUMMARY"
          "$OUT" --headless --self-test --quit

      - name: Fetch matching-arch blazium-cli + crash_reporter + stage package tree
        run: |
          set -euo pipefail
          mkdir -p build/package/linux/bin
          python3 ci/fetch_latest_cli.py \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --out build/package/linux/bin/blazium-cli
          python3 ci/fetch_latest_crash_reporter.py \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --out build/package/linux/bin/crash_reporter
          cp "$HUB_BIN" build/package/linux/bin/blazium-hub
          chmod +x build/package/linux/bin/blazium-hub build/package/linux/bin/blazium-cli build/package/linux/bin/crash_reporter
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/blazium-cli" "$@"' > build/package/linux/bin/blazium
          chmod +x build/package/linux/bin/blazium
          printf '%s\n' "${{ needs.resolve-engine.outputs.version }}" > build/package/linux/VERSION
          printf '%s\n' "${{ needs.resolve-engine.outputs.version }}" > build/package/linux/bin/VERSION
          test -s build/package/linux/bin/crash_reporter.version
          test -s build/package/linux/VERSION
          ls -lh build/package/linux/bin/
          build/package/linux/bin/blazium-hub --headless --self-test --quit

      - name: Install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz | tar -xz
          sudo mv nfpm /usr/local/bin/

      - name: Build .deb
        run: |
          set -euo pipefail
          export VERSION=${{ needs.resolve-engine.outputs.version }}
          if [[ "${{ matrix.arch }}" == "x86_32" ]]; then
            export NFPM_ARCH=i386
          else
            export NFPM_ARCH=amd64
          fi
          mkdir -p packaging/linux/dist
          (cd packaging/linux && VERSION="$VERSION" NFPM_ARCH="$NFPM_ARCH" nfpm package --packager deb --target dist/)
          DEB=$(ls packaging/linux/dist/blazium-hub_*_${NFPM_ARCH}.deb | head -n1)
          test -f "$DEB"
          echo "DEB_PATH=$DEB" >> "$GITHUB_ENV"
          BASE=$(basename "$DEB")
          echo "DEB_NAME=$BASE" >> "$GITHUB_ENV"
          ls -lh packaging/linux/dist/

      - name: Install/uninstall smoke (dpkg)
        run: |
          set -euo pipefail
          chmod +x ci/smoke_install_linux.sh ci/smoke_install_linux_debinfo.sh
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            ./ci/smoke_install_linux.sh "$DEB_PATH"
          else
            ./ci/smoke_install_linux_debinfo.sh "$DEB_PATH"
          fi

      - name: Stage unsigned deb
        run: |
          set -euo pipefail
          mkdir -p "upload/linux/${{ needs.resolve-engine.outputs.version }}"
          cp "$DEB_PATH" "upload/linux/${{ needs.resolve-engine.outputs.version }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.arch }}
          path: upload/linux/**

      - name: Scrub encryption key material
        if: always()
        run: rm -f production.env .ci/export_encryption.key

  validate:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, export-linux, export-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '{linux-deb-*,windows-package-unsigned-*}'
          path: artifacts
          merge-multiple: false

      - name: Require Linux and Windows exports
        run: |
          set -euo pipefail
          test "$(find artifacts -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find artifacts -type f -name 'BlaziumHub.exe' | wc -l)" -eq 2
          find artifacts -type f -name '*.deb' -o -name 'BlaziumHub.exe' | sort

  sign-linux:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, validate]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-deb-${{ matrix.arch }}
          path: upload/linux

      - name: GPG sign deb
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg
          DEB="$(find upload/linux -type f -name '*.deb' | head -n1)"
          test -n "$DEB"
          test -f "$DEB"
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --output "${DEB}.sig" --detach-sign "$DEB"
          fi
          test -f "${DEB}.sig"
          echo "DEB_PATH=$DEB" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb-signed-${{ matrix.arch }}
          path: upload/linux/**

  # Windows Authenticode runs only after validate confirms every export exists.
  # Flow: validate → sign bins → ISCC → sign setup → smoke → CDN.
  export-windows:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, build-engine]
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: engine-windows-x86_64-editor
          path: .ci/out/windows-editor

      - uses: actions/download-artifact@v8
        with:
          name: engine-windows-${{ matrix.arch }}-template_release
          path: .ci/out/windows-template

      - name: Arrange editor + template paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/out/windows
          cp .ci/out/windows-editor/editor.exe .ci/out/windows/editor.exe
          cp .ci/out/windows-template/template_release.exe .ci/out/windows/template_release.exe
          ls -lh .ci/out/windows/
          test "$(stat -c%s .ci/out/windows/editor.exe)" -ge 10485760
          test "$(stat -c%s .ci/out/windows/template_release.exe)" -ge 5242880
          echo "Using x86_64 editor + ${{ matrix.arch }} template"

      - name: Materialize production.env
        shell: bash
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_ENV:-}" ]; then
            echo "PRODUCTION_ENV GitHub secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > production.env
          set -a
          # shellcheck disable=SC1091
          source production.env
          set +a
          if [ -z "${SCRIPT_ENCRYPTION_KEY:-}" ]; then
            echo "SCRIPT_ENCRYPTION_KEY missing in production.env" >&2
            exit 1
          fi
          if [[ ! "$SCRIPT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SCRIPT_ENCRYPTION_KEY must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          echo "::add-mask::$SCRIPT_ENCRYPTION_KEY"
          umask 077
          mkdir -p .ci
          printf '%s' "$SCRIPT_ENCRYPTION_KEY" > .ci/export_encryption.key
          rm -f production.env
          echo "Export encryption key written to file (not GITHUB_ENV)"

      - name: Stamp Hub version into project
        shell: bash
        run: |
          set -euo pipefail
          python ci/stamp_hub_version.py "${{ needs.resolve-engine.outputs.version }}"
          grep -E '^config/version=' project.godot
          grep -E '^crash_reporter/(build_id|app_version|endpoint|upload_mode)=' project.godot
          grep -E '^application/(file|product)_version=' export_presets.cfg | head -n4

      - name: Patch export_presets custom template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")
          tpl = Path(".ci/out/windows/template_release.exe").resolve().as_posix()
          out = []
          for line in text.splitlines():
              if line.startswith("custom_template/release="):
                  out.append(f'custom_template/release="{tpl}"')
              elif line.startswith("custom_template/debug="):
                  out.append(f'custom_template/debug="{tpl}"')
              else:
                  out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Export Windows Hub (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          if [[ "$ARCH" == "x86_32" ]]; then
            PRESET="Windows Desktop x86_32"
            OUT="build/windows/BlaziumHub.x86_32.exe"
          else
            PRESET="Windows Desktop"
            OUT="build/windows/BlaziumHub.x86_64.exe"
          fi
          export SCRIPT_ENCRYPTION_KEY
          SCRIPT_ENCRYPTION_KEY="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.ci/export_encryption.key")"
          export GODOT_SCRIPT_ENCRYPTION_KEY="$SCRIPT_ENCRYPTION_KEY"
          mkdir -p build/windows
          .ci/out/windows/editor.exe --headless --path . --import
          .ci/out/windows/editor.exe --headless --path . --export-release "$PRESET" "$OUT"
          test -f "$OUT"
          cp "$OUT" build/windows/BlaziumHub.exe
          echo "### Hub Windows ${ARCH}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$OUT" >> "$GITHUB_STEP_SUMMARY"
          set +e
          build/windows/BlaziumHub.exe --headless --self-test --quit
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$ARCH" == "x86_32" ]]; then
            CDB=""
            for candidate in \
              "/c/Program Files (x86)/Windows Kits/10/Debuggers/x86/cdb.exe" \
              "/c/Program Files/Windows Kits/10/Debuggers/x86/cdb.exe"
            do
              if [[ -f "$candidate" ]]; then
                CDB="$candidate"
                break
              fi
            done
            if [[ -n "$CDB" ]]; then
              echo "self-test exit ${rc}; capturing stack with ${CDB}" >&2
              "$CDB" -g -G -c "sxe av; g; k 40; q" -logo "$RUNNER_TEMP/cdb-x86-self-test.log" \
                build/windows/BlaziumHub.exe -- --headless --self-test --quit || true
              cat "$RUNNER_TEMP/cdb-x86-self-test.log" || true
            else
              echo "cdb.exe not found; self-test exit ${rc}" >&2
            fi
          fi
          if [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi

      - name: Fetch matching-arch blazium-cli + crash_reporter + stage package tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/windows/Hub
          cp build/windows/BlaziumHub.exe build/package/windows/Hub/BlaziumHub.exe
          python ci/fetch_latest_cli.py \
            --platform windows \
            --arch "${{ matrix.arch }}" \
            --out build/package/windows/blazium-cli.exe
          python ci/fetch_latest_crash_reporter.py \
            --platform windows \
            --arch "${{ matrix.arch }}" \
            --out build/package/windows/Hub/crash_reporter.exe
          cp packaging/windows/blazium.cmd build/package/windows/blazium.cmd
          cp packaging/windows/blazium-hub.cmd build/package/windows/blazium-hub.cmd
          printf '%s\n' "${{ needs.resolve-engine.outputs.version }}" > build/package/windows/VERSION
          printf '%s\n' "${{ needs.resolve-engine.outputs.version }}" > build/package/windows/Hub/VERSION
          test -s build/package/windows/Hub/crash_reporter.version
          test -s build/package/windows/VERSION
          ls -lh build/package/windows/ build/package/windows/Hub/
          build/package/windows/Hub/BlaziumHub.exe --headless --self-test --quit

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package-unsigned-${{ matrix.arch }}
          path: build/package/windows/**

      - name: Scrub encryption key material
        if: always()
        shell: bash
        run: rm -f production.env .ci/export_encryption.key

  sign-windows-binaries:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, validate]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-package-unsigned-${{ matrix.arch }}
          path: build/package/windows

      - name: Assert unsigned package tree
        run: |
          set -euo pipefail
          test -f build/package/windows/Hub/BlaziumHub.exe
          test -f build/package/windows/blazium-cli.exe
          test -f build/package/windows/Hub/crash_reporter.exe
          test -s build/package/windows/Hub/crash_reporter.version
          test -s build/package/windows/VERSION
          test -s build/package/windows/Hub/VERSION
          # CLI and crash_reporter are already signed in their own repos. Do not re-sign them.
          mkdir -p signed/Hub
          ls -lh build/package/windows/ build/package/windows/Hub/

      - uses: bioblaze/sslcom-code-signer@v6
        name: Sign BlaziumHub.exe
        continue-on-error: true
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/package/windows/Hub/BlaziumHub.exe
          output_path: ./signed/Hub
          environment_name: PROD

      - name: Replace Hub exe with signed binary
        run: |
          set -euo pipefail
          if [ -f signed/Hub/BlaziumHub.exe ]; then
            cp -f signed/Hub/BlaziumHub.exe build/package/windows/Hub/BlaziumHub.exe
          else
            echo "signing missing for BlaziumHub.exe; keeping unsigned binary" >&2
            test -f build/package/windows/Hub/BlaziumHub.exe
          fi
          test "$(stat -c%s build/package/windows/Hub/BlaziumHub.exe)" -ge 1048576
          test "$(stat -c%s build/package/windows/blazium-cli.exe)" -ge 1048576
          test "$(stat -c%s build/package/windows/Hub/crash_reporter.exe)" -ge 1048576
          ls -lh build/package/windows/ build/package/windows/Hub/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package-signed-bins-${{ matrix.arch }}
          path: build/package/windows/**

  package-windows:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, sign-windows-binaries]
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: windows-package-signed-bins-${{ matrix.arch }}
          path: build/package/windows

      - name: Install Inno Setup + ImageMagick
        shell: powershell
        run: |
          choco install innosetup imagemagick -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer (iscc)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ needs.resolve-engine.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          if (-not (Test-Path "build\package\windows\Hub\BlaziumHub.exe")) { throw "Missing Hub exe" }
          if (-not (Test-Path "build\package\windows\blazium-cli.exe")) { throw "Missing CLI exe" }
          if (-not (Test-Path "build\package\windows\Hub\crash_reporter.exe")) { throw "Missing crash_reporter exe" }
          $src = (Resolve-Path "build\package\windows").Path
          $ico = "packaging\windows\blazium-hub.ico"
          $magickExe = $null
          $cmd = Get-Command magick -ErrorAction SilentlyContinue
          if ($cmd) { $magickExe = $cmd.Source }
          if (-not $magickExe) {
            $found = Get-ChildItem "C:\Program Files\ImageMagick*\magick.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $magickExe = $found.FullName }
          }
          $icoOk = $false
          if ($magickExe) {
            & $magickExe "assets\icons\icon.svg" -background none -resize 256x256 $ico
            if ($LASTEXITCODE -eq 0 -and (Test-Path $ico)) {
              Write-Host "Generated $ico via ImageMagick"
              $icoOk = $true
            }
          }
          if (-not $icoOk) {
            python ci/write_fallback_ico.py $ico
          }
          if (-not (Test-Path $ico)) { throw "Missing $ico" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Missing $iscc" }
          $iss = (Resolve-Path "packaging\windows\blazium-hub.iss").Path
          $args = @(
            "/DMyAppVersion=$ver",
            "/DMyAppArchLabel=$arch",
            "/DMyAppSourceDir=$src",
            $iss
          )
          if ($arch -eq "x86_32") {
            $args = @(
              "/DMyAppVersion=$ver",
              "/DMyAppArchLabel=$arch",
              "/DMyAppIs32=1",
              "/DMyAppSourceDir=$src",
              $iss
            )
          }
          Write-Host "ISCC $($args -join ' ')"
          & $iscc @args
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = "packaging\windows\Output\BlaziumHub-Setup-$ver-$arch.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          Get-ChildItem "packaging\windows\Output" | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-setup-unsigned-${{ matrix.arch }}
          path: packaging/windows/Output/BlaziumHub-Setup-${{ needs.resolve-engine.outputs.version }}-${{ matrix.arch }}.exe

  sign-windows-installer:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, package-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-setup-unsigned-${{ matrix.arch }}
          path: packaging/windows/Output

      - name: Locate setup
        id: setup
        run: |
          set -euo pipefail
          VER="${{ needs.resolve-engine.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          SETUP="packaging/windows/Output/BlaziumHub-Setup-${VER}-${ARCH}.exe"
          test -f "$SETUP"
          mkdir -p signed/setup
          echo "path=$SETUP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$SETUP")" >> "$GITHUB_OUTPUT"
          ls -lh packaging/windows/Output/

      - uses: bioblaze/sslcom-code-signer@v6
        name: Sign installer
        continue-on-error: true
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.setup.outputs.path }}
          output_path: ./signed/setup
          environment_name: PROD

      - name: Stage signed installer artifact
        run: |
          set -euo pipefail
          VER="${{ needs.resolve-engine.outputs.version }}"
          NAME="${{ steps.setup.outputs.name }}"
          SIGNED="signed/setup/${NAME}"
          if [ ! -f "$SIGNED" ]; then
            echo "installer signing failed; keeping unsigned setup" >&2
            cp "$SETUP" "$SIGNED"
          fi
          test -f "$SIGNED"
          test "$(stat -c%s "$SIGNED")" -ge 1048576
          mkdir -p "upload/windows/${VER}"
          cp "$SIGNED" "upload/windows/${VER}/"
          ls -lh "upload/windows/${VER}/"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}
          path: upload/windows/**

  publish-windows:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, sign-windows-installer]
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-${{ matrix.arch }}
          path: upload/windows

      - name: Locate signed setup
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.resolve-engine.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          SETUP="upload/windows/${VER}/BlaziumHub-Setup-${VER}-${ARCH}.exe"
          test -f "$SETUP"
          echo "SETUP_PATH=$SETUP" >> "$GITHUB_ENV"
          echo "SETUP_NAME=$(basename "$SETUP")" >> "$GITHUB_ENV"
          echo "path=$SETUP" >> "$GITHUB_OUTPUT"
          ls -lh "upload/windows/${VER}/"

      - name: Install/uninstall smoke (custom DIR)
        shell: powershell
        run: |
          ./ci/smoke_install_windows.ps1 -SetupPath "$env:SETUP_PATH"

  publish:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, publish-windows, sign-linux]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ needs.resolve-engine.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-deb-signed-x86_64
          path: linux/x86_64

      - uses: actions/download-artifact@v8
        with:
          name: linux-deb-signed-x86_32
          path: linux/x86_32

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-x86_64
          path: windows/x86_64

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-x86_32
          path: windows/x86_32

      - name: Require every installer
        id: files
        run: |
          set -euo pipefail
          VER="${{ needs.resolve-engine.outputs.version }}"
          find_one() {
            local pattern="$1"
            local found
            found="$(find . -type f -name "$pattern" | head -n1)"
            test -n "$found"
            echo "$found"
          }
          DEB64="$(find_one 'blazium-hub_*_amd64.deb')"
          DEB32="$(find_one 'blazium-hub_*_i386.deb')"
          test -f "${DEB64}.sig"
          test -f "${DEB32}.sig"
          EXE64="$(find_one "BlaziumHub-Setup-${VER}-x86_64.exe")"
          EXE32="$(find_one "BlaziumHub-Setup-${VER}-x86_32.exe")"
          {
            echo "deb64=$DEB64"
            echo "deb32=$DEB32"
            echo "exe64=$EXE64"
            echo "exe32=$EXE32"
          } >> "$GITHUB_OUTPUT"

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ steps.files.outputs.deb64 }}
          out_dir: hub/linux/${{ needs.resolve-engine.outputs.version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ steps.files.outputs.deb64 }}.sig
          out_dir: hub/linux/${{ needs.resolve-engine.outputs.version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ steps.files.outputs.deb32 }}
          out_dir: hub/linux/${{ needs.resolve-engine.outputs.version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ steps.files.outputs.deb32 }}.sig
          out_dir: hub/linux/${{ needs.resolve-engine.outputs.version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ steps.files.outputs.exe64 }}
          out_dir: hub/windows/${{ needs.resolve-engine.outputs.version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ steps.files.outputs.exe32 }}
          out_dir: hub/windows/${{ needs.resolve-engine.outputs.version }}

      - name: Register with Cerebro
        env:
          VER: ${{ needs.resolve-engine.outputs.version }}
        run: |
          set -euo pipefail
          register() {
            local name="$1" os="$2" arch="$3" file="$4" signing="$5"
            local base
            base="$(basename "$file")"
            local url="https://cdn.blazium.app/hub/${os}/${VER}/${base}"
            local sig=""
            if [[ "$signing" == "gpg" ]]; then
              sig="${url}.sig"
            fi
            local sha size
            sha=$(sha256sum "$file" | awk '{print $1}')
            size=$(stat -c%s "$file")
            curl -fsS -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
              -H "Content-Type: application/json" \
              -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
              -d "$(cat <<EOF
          {
            "name": "Blazium Hub",
            "type": "hub",
            "version": "${VER}",
            "os": "${os}",
            "arch": "${arch}",
            "file": "${url}",
            "sig": "${sig}",
            "sha256": "${sha}",
            "size": ${size},
            "signing": "${signing}",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"
          }
          register "Blazium Hub" linux x86_64 "${{ steps.files.outputs.deb64 }}" gpg
          register "Blazium Hub" linux x86_32 "${{ steps.files.outputs.deb32 }}" gpg
          register "Blazium Hub" windows x86_64 "${{ steps.files.outputs.exe64 }}" sslcom
          register "Blazium Hub" windows x86_32 "${{ steps.files.outputs.exe32 }}" sslcom

      - name: Republish Hub catalog via Cerebro
        run: |
          set -euo pipefail
          curl -fsS -X POST "${{ secrets.CEREBRO_URL }}/api/v1/cdn/publish" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
            -d '{"scope":"hub"}'

  github-release:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [resolve-engine, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${{ needs.publish.outputs.version }}"
          fi
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Download all Hub installers
        uses: actions/download-artifact@v8
        with:
          pattern: '{linux-deb-signed-*,windows-installer-*}'
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.sig' \) | sort)
          test "${#FILES[@]}" -ge 4
          NOTES="Blazium Hub ${VER}

          Installers (Linux/Windows × x86_64/x86_32), each bundling matching-arch blazium-cli and crash_reporter.

          | Platform | Arch | Artifact |
          |----------|------|----------|
          | Linux | x86_64 | \`*.amd64.deb\` |
          | Linux | x86_32 | \`*.i386.deb\` |
          | Windows | x86_64 | \`BlaziumHub-Setup-${VER}-x86_64.exe\` |
          | Windows | x86_32 | \`BlaziumHub-Setup-${VER}-x86_32.exe\` |

          CDN:
          - https://cdn.blazium.app/hub/windows/${VER}/
          - https://cdn.blazium.app/hub/linux/${VER}/

          Silent Windows (any directory):
          \`\`\`
          BlaziumHub-Setup-${VER}-x86_64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=\"D:\\\\Tools\\\\Blazium\"
          \`\`\`
          Add \`/LAUNCH\` to start Hub after a silent install.
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Blazium Hub ${VER}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release view "$TAG"
